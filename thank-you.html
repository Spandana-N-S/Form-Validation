<!--When the user fills out the form with valid data, they will be redirected to this HTML page. This page includes a thank you message with solid water effect.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                linear-gradient(180deg, rgba(0, 60, 130, 0.5) 0%, rgba(0, 80, 160, 0.6) 50%, rgba(0, 40, 100, 0.7) 100%),
                url('https://images.unsplash.com/photo-1505118380757-91f5f5632de0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 40, 90, 0.4) 0%, rgba(0, 60, 120, 0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Solid Water Container - No waves */
        .water-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Solid ocean water body */
        .ocean-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                rgba(0, 70, 150, 0.7) 0%,
                rgba(0, 50, 120, 0.8) 50%,
                rgba(0, 30, 80, 0.9) 100%
            );
        }
        
        /* Subtle water surface line */
        .water-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(135, 206, 235, 0.5) 30%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(135, 206, 235, 0.5) 70%,
                transparent 100%
            );
        }
        
        /* Main container */
        .container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 50, 100, 0.3);
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(135, 206, 235, 0.3);
        }
        
        /* Heart icon */
        .heart-icon {
            font-size: 80px;
            color: #2874a6;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(40, 116, 166, 0.5);
        }
        
        /* Main heading */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 42px;
            color: #0a3050;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        /* Sub message */
        p {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            color: #2874a6;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        /* Button */
        .btn {
            display: inline-block;
            padding: 12px 35px;
            background: linear-gradient(135deg, #1a5276 0%, #2874a6 50%, #3498db 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(26, 82, 118, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(26, 82, 118, 0.6);
        }
    </style>
</head>
<body>
    <!-- Solid Water Effect -->
    <div class="water-container">
        <div class="ocean-body"></div>
        <div class="water-surface"></div>
    </div>
    
    <div class="container">
        <div class="heart-icon">
            <i class="fas fa-heart"></i>
        </div>
        <h1>Thank You!</h1>
        <p>Your form has been submitted successfully.</p>
        <a href="index.html" class="btn">
            <i class="fas fa-redo"></i> Fill Again
        </a>
    </div>
</body>
</html>
